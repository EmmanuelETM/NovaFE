# Integración continua en GitHub Actions.
#
# Los runners de ubuntu traen Docker, que es lo que necesitan las pruebas de
# integración para levantar PostgreSQL con Testcontainers.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build y pruebas
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Instalar el SDK de .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cachear paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          # Las versiones están centralizadas en Directory.Packages.props, así
          # que ese archivo describe por completo lo que se restaura.
          key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore NovaFE.slnx

      - name: Build
        run: dotnet build NovaFE.slnx --no-restore --configuration Release

      - name: Test
        run: >-
          dotnet test NovaFE.slnx
          --no-build
          --configuration Release
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults
          --collect:"XPlat Code Coverage"

      - name: Publicar resultados
        # always() para que los resultados suban incluso cuando alguna prueba
        # falla, que es justo cuando hacen falta.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7
